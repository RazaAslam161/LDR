# Supabase project config. Committed so `supabase start` reproduces the stack
# locally and `supabase db reset` replays migrations/ from empty.
#
# The project ref is NOT secret (it is in every API URL the app ships with).
# Nothing in this file is a credential.

project_id = "miles"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the production major version, or a migration can replay locally and
# fail in production on syntax the older planner rejects.
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "tethered://auth-callback"
# Email confirmation and password-reset links redirect here. Without the
# scheme on this list Supabase silently falls back to site_url, which is how
# every confirmation mail ended up opening "localhost refused to connect".
additional_redirect_urls = ["tethered://auth-callback", "tethered://join"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
