org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation is off. The reason recorded when it was set:
# the Kotlin compiler's incremental storage crashes on cross-drive relative
# paths on Windows, and this repo and the pub cache sit on different drives.
# The drive-pair condition still holds; the causal claim is inherited and is
# evidenced nowhere in the repo, so treat it as the reason someone believed
# rather than one that was measured, and re-test before dropping the flag.
# (Deliberately names no drive letter: this said "the E: drive" for eleven days
# after the repo left E:, which is how the only note explaining the flag came
# to read as obsolete.)
kotlin.incremental=false
