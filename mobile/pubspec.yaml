name: miles
description: Feel close, even from here. A quiet app for couples apart.
publish_to: "none"
version: 0.1.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Supabase ────────────────────────────────────────────────
  supabase_flutter: ^2.6.0

  # ─── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ─── Routing ─────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── Time / timezones ────────────────────────────────────────
  intl: ^0.19.0
  timezone: ^0.11.0

  # ─── Fonts ───────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ─── Icons ───────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ─── Haptics + sensors (for Breath Sync + Reach) ─────────────
  vibration: ^3.2.0
  sensors_plus: ^6.0.1

  # ─── Secure env ──────────────────────────────────────────────
  flutter_dotenv: ^5.1.0

  # ─── Storage ─────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ─── Crypto (E2EE for the Closer intimacy module) ────────────
  cryptography: ^2.7.0
  # Direct because app_lock.dart imports it; it was only ever present
  # transitively, which is a dependency you do not control the version of.
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.2

  # ─── Local auth (PIN / biometric gate for Closer) ────────────
  local_auth: ^2.3.0

  # ─── File picking (chat photos + Vault) ──────────────────────
  image_picker: ^1.1.2
  # Direct so PhotoPickerService can reach ImagePickerAndroid and turn the
  # Android system Photo Picker ON. Left at the plugin's default the multi-pick
  # opens the DOCUMENT provider — the file manager — instead of the gallery.
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0

  # ─── Voice notes (record + playback in chat) ─────────────────
  record: ^7.1.0
  just_audio: ^0.10.5

  # ─── Misc utilities ──────────────────────────────────────────
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  flutter_animate: ^4.5.2
  google_mobile_ads: ^9.0.0
  app_links: ^7.2.0
  geocoding: ^4.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_cropper: ^12.2.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  permission_handler: ^12.0.3
  flutter_webrtc: ^1.5.2
  # Already resolved transitively at 1.5.2 — promoted to direct so the call
  # screen can hold the display on. Pulls in no new package or native code.
  wakelock_plus: ^1.5.2
  image: ^4.9.1
  youtube_player_flutter: 9.1.1
  camera: ^0.12.0+1
  flutter_foreground_task: ^9.2.2
  webview_flutter: ^4.14.0
  lottie: ^3.3.3
  http: ^1.6.0
  xml: ^7.0.1
  uuid: ^4.5.3
  cached_network_image: ^3.4.1
  screen_brightness: ^2.1.11
  google_mlkit_subject_segmentation: ^0.0.3
  google_mlkit_pose_detection: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/emoji/
