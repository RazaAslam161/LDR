name: miles
description: Feel close, even from here. A quiet app for couples apart.
publish_to: "none"
version: 0.1.0+71

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  # ─── Supabase ────────────────────────────────────────────────
  supabase_flutter: ^2.6.0

  # ─── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ─── Routing ─────────────────────────────────────────────────
  go_router: ^14.2.7

  # ─── Time / timezones ────────────────────────────────────────
  intl: ^0.19.0
  timezone: ^0.11.0

  # ─── Icons ───────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ─── Haptics + sensors (for Breath Sync + Reach) ─────────────
  vibration: ^3.2.0
  sensors_plus: ^6.0.1

  # ─── Secure env ──────────────────────────────────────────────
  flutter_dotenv: ^5.1.0

  # ─── Storage ─────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ─── Crypto (E2EE for the Closer intimacy module) ────────────
  cryptography: ^2.7.0
  # Direct because app_lock.dart imports it; it was only ever present
  # transitively, which is a dependency you do not control the version of.
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.2

  # ─── Local auth (PIN / biometric gate for Closer) ────────────
  local_auth: ^2.3.0

  # ─── File picking (chat photos + Vault) ──────────────────────
  image_picker: ^1.1.2
  # Direct so PhotoPickerService can reach ImagePickerAndroid and turn the
  # Android system Photo Picker ON. Left at the plugin's default the multi-pick
  # opens the DOCUMENT provider — the file manager — instead of the gallery.
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0

  # ─── Voice notes (record + playback in chat) ─────────────────
  record: ^7.1.0
  just_audio: ^0.10.5
  # Direct because JustAudioEngine configures the audio session ONCE as
  # sonification + transient-may-duck: an unconfigured session made every
  # 200ms cue seize PERMANENT audio focus and kill the user's own music.
  # Already resolved transitively at 0.2.4 via just_audio — same version, no
  # new package, no new native code.
  audio_session: ^0.2.2

  # ─── Misc utilities ──────────────────────────────────────────
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  flutter_animate: ^4.5.2
  app_links: ^7.2.0
  geocoding: ^4.0.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  image_cropper: ^12.2.1
  video_player: ^2.14.0
  chewie: ^1.13.1
  permission_handler: ^12.0.3
  flutter_webrtc: ^1.5.2
  # Already resolved transitively at 1.5.2 — promoted to direct so the call
  # screen can hold the display on. Pulls in no new package or native code.
  wakelock_plus: ^1.5.2
  image: ^4.9.1
  # Poster frames for videos in an album grid. A video has no bytes a grid can
  # paint, and a pick of photos and videos together is the normal case — without
  # this the grid draws a hole wherever a video landed.
  video_thumbnail: ^0.5.6
  youtube_player_flutter: 9.1.3
  # Already resolved transitively at 6.1.5 — youtube_player_flutter's own
  # iframe host is this. Promoted to direct so Watch Together can stop throwing
  # the two of you into Chrome for every link it cannot play itself, and so
  # Vimeo and TikTok can be driven through their JS player APIs. Same version,
  # so no new package and no new native code.
  flutter_inappwebview: ^6.1.5
  camera: ^0.12.0+1
  flutter_foreground_task: ^9.2.2
  lottie: ^3.3.3
  http: ^1.6.0
  xml: ^7.0.1
  uuid: ^4.5.3
  cached_network_image: ^3.4.1
  # Direct because the media pager warms the FILE for the pages two and three
  # swipes out — the same singleton and the same cache key
  # CachedNetworkImage reads. Only ever present transitively before, which is
  # a version this app does not control.
  flutter_cache_manager: ^3.4.1
  screen_brightness: ^2.1.11
  google_mlkit_subject_segmentation: ^0.0.3
  google_mlkit_pose_detection: ^0.14.1
  file_picker: ^11.0.3
  flutter_image_compress: ^2.5.1
  mapbox_maps_flutter: ^2.28.1
# The ONE vendored fork, and why: flutter_webrtc leaves MediaProjection's
# onStop empty (the system "Stop sharing" press dies there) and never plumbs
# Android 14's onCapturedContentResize (the only signal a share is app-scoped,
# which gates the safe live self-preview). Both are ~20 lines in ONE file —
# third_party/flutter_webrtc/.../GetUserMediaImpl.java, marked "Miles patch".
# Vendored at the exact previously-resolved 1.6.0, so nothing else changes.
dependency_overrides:
  flutter_webrtc:
    path: third_party/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Ships in the APK as assets/flutter_assets/.env, in plaintext - a
    # sideloaded APK is a zip anyone can open. The Supabase URL and anon key
    # are fine there; RLS assumes both are known. A value that has to stay
    # revocable goes to app_secrets behind an edge function instead - see
    # map-token, and giphy_service.dart for the key that used to be in here.
    # METERED_TURN_* (call_controller.dart:688) is the one name left that would
    # publish a credential to every handset if it were ever filled in.
    - .env
    - assets/emoji/
    # 15 UI cues + one ambient bed, OGG Vorbis, ~730KB. Names are generic
    # UI-sound vocabulary on purpose — unzip -l lists every asset path in
    # the clear. Provenance per cue lives beside its enum in
    # core/services/sound/cue.dart.
    - assets/sound/
    # Spot illustrations. Four are DRAWN BY tool/generate_art.dart — not
    # generated images, so exact palette and no text possible. jar.webp is the
    # owner's photograph (3:4, cork through table reflection); its warm-clamp
    # and crop are not reproducible from this repo — see BRAIN §141. 69KB for
    # five against a 2.5MB ceiling.
    - assets/art/
    # The Doorstep's cast and world — twelve WebP layers the OWNER generated
    # (BRAIN §227: characters, backdrops, door, lamp, bird, envelope), matted
    # and sized by tool; ~400KB total. Composited and animated in
    # features/unlink/scene/ — the sprites are stills, all motion is code.
    - assets/scene/
    # The presence cast: the same two owner-rendered people as assets/scene,
    # re-cut from the full-resolution originals to a head-and-shoulders
    # portrait so they read inside a 30dp mark. Their own directory rather
    # than assets/scene because the Doorstep loads that one whole, and a badge
    # on twenty screens must not decode a street to draw a face.
    - assets/presence/
    # The Opening: the 14s film a couple sees once, after they pair. Portrait
    # 406x720 H.264, NO audio track on purpose — the score plays through
    # MilesSound's loop channel so the user's mute and the server sound-kill
    # still govern it, which a baked-in track would bypass.
    - assets/opening/
    # The doorstep's eight films and four held stages (the film's own last
    # frame, extracted at build time — the live stage the 15-minute
    # conversation plays over). Owner-generated; encoded 480px CRF26, no
    # audio tracks (sound rides MilesSound so mute and the kill switch hold).
    - assets/unlink_films/
    # The OFL texts ship because the license requires them to travel with the
    # font software; theme.dart registers both with LicenseRegistry so they
    # surface in the standard licenses page.
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-Inter.txt

  # Bundled so first paint renders the real faces — google_fonts fetched these
  # over HTTP at runtime (PERF_PLAN hotspot #9: fallback-glyph reflow, broken
  # typography offline). Static latin instances, 460KB total.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
