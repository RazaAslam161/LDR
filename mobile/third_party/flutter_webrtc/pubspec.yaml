name: flutter_webrtc
description: Flutter WebRTC plugin for iOS/Android/Desktop/Web, based on GoogleWebRTC.
version: 1.6.0
homepage: https://github.com/cloudwebrtc/flutter-webrtc
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  collection: ^1.17.0
  dart_webrtc: ^1.8.0
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  path_provider: ^2.0.2
  web: ^1.0.0
  webrtc_interface: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  lints: ^4.0.0
  pedantic: ^1.11.1
  test: any

# Vendored for Android only. The upstream iOS, macOS, Windows, Linux and
# desktop C++ (common/, third_party/) trees were removed on 2026-09-02: this
# app builds one platform, and a fork carries only what it patches and ships.
flutter:
  plugin:
    platforms:
      android:
        package: com.cloudwebrtc.webrtc
        pluginClass: FlutterWebRTCPlugin
