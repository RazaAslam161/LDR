name: flutter_webrtc
description: Flutter WebRTC plugin for iOS/Android/Desktop/Web, based on GoogleWebRTC.
version: 1.6.0
homepage: https://github.com/cloudwebrtc/flutter-webrtc
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=1.22.0"

dependencies:
  collection: ^1.17.0
  dart_webrtc: ^1.8.0
  flutter:
    sdk: flutter
  logger: ^2.0.2+1
  path_provider: ^2.0.2
  web: ^1.0.0
  webrtc_interface: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  import_sorter: ^4.6.0
  lints: ^4.0.0
  pedantic: ^1.11.1
  test: any

# Vendored for Android and iOS. The Android tree carries the Miles patches
# (GetUserMediaImpl.java, OrientationAwareScreenCapturer.java,
# MilesVideoProcessorHook.java - all marked "Miles patch"). The upstream iOS
# tree was removed on 2026-09-02 when this app shipped one platform, and was
# RESTORED UNPATCHED from upstream 1.6.0 on 2026-09-08 for the iOS port: it is
# byte-identical to pub.dev flutter_webrtc 1.6.0 and carries no Miles change.
# macOS, Windows, Linux and the desktop C++ (common/, third_party/) trees stay
# removed - this app does not build them.
flutter:
  plugin:
    platforms:
      android:
        package: com.cloudwebrtc.webrtc
        pluginClass: FlutterWebRTCPlugin
      ios:
        pluginClass: FlutterWebRTCPlugin
